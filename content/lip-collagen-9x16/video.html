      </div>`);
  });
  document.querySelectorAll(".ic svg path, .ic svg circle, .ic svg ellipse").forEach(el => el.setAttribute("pathLength", "1"));

  const numEl = document.getElementById("num"), pulseEl = document.getElementById("pulse");
  window.DURATION = 15;
  window.render = (t) => {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; }
    let n = 0, last = -1;
    times.forEach((ti, i) => { if (t >= ti + 0.2) { n = i + 1; last = ti + 0.2; } });
    numEl.textContent = n ? String(n) : "";
    numEl.style.transform = last >= 0 ? `scale(${1 + 0.2 * Math.exp(-(t - last) * 11)})` : "";
    let p = 0;
    times.forEach(ti => { const dt = t - (ti + 0.55); if (dt >= 0) p += Math.exp(-dt * 5); });
    pulseEl.style.opacity = t < 3.4 ? 0 : Math.min(1, 0.25 + 0.55 * Math.min(p, 1.3));
  };

  // Live preview when opened directly in a browser.
  if (!navigator.webdriver) {
    let start;
    const loop = (ts) => { start ??= ts; render(((ts - start) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
    document.fonts.ready.then(() => requestAnimationFrame(loop));
  } else {
    render(0);
  }
</script>
</body>
</html>
